<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOU'VE BEEN HACKED !!!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ff0000d3;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }

        .hacked-text {
            font-size: 120px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 20px #ff0000,
                         0 0 40px #ff0000;
            animation: glitch 0.5s infinite;
            letter-spacing: 10px;
        }

        .bottom-text {
            position: absolute;
            bottom: 50px;
            text-align: center;
            font-size: 28px;
            width: 100%;
        }

        .bottom-text a {
            color: #ff0000;
            text-decoration: underline;
            font-weight: bold;
        }

        .bottom-text a:hover {
            color: #ffffff;
            text-shadow: 0 0 15px #ff0000;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 5px); }
            40% { transform: translate(5px, -5px); }
            60% { transform: translate(-5px, 5px); }
            80% { transform: translate(5px, -5px); }
            100% { transform: translate(0); }
        }

        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(255, 0, 0, 0.1) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            animation: scan 2s linear infinite;
            z-index: 1;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    
    <div>
        <div class="hacked-text">YOU'VE BEEN HACKED !!!</div>
    </div>
    
    <div class="bottom-text">
        if you want to save yourself <a href="https://cybersecurity.pratibhaskilldevelopment.com/" target="_blank">Click here</a>
    </div>
</body>
</html>
